name: FlightGlance
options:
  bundleIdPrefix: app.flightglance
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  FlightGlance:
    type: application
    platform: iOS
    sources:
      - path: FlightGlance
      - path: Shared
    dependencies:
      - target: FlightGlanceWidgets
        embed: true
    info:
      path: FlightGlance/Info.plist
      properties:
        CFBundleDisplayName: FlightGlance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: >-
          FlightGlance uses your iPhone's GPS to show where you are on the offline map, with
          your ground speed, GPS altitude and progress — even in Airplane Mode. Your location
          stays on this iPhone.
        NSLocationTemporaryUsageDescriptionDictionary:
          FlightTracking: >-
            Precise location lets FlightGlance draw your flight track and estimate arrival
            accurately.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.flightglance.FlightGlance
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  FlightGlanceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FlightGlanceWidgets
      - path: Shared
    info:
      path: FlightGlanceWidgets/Info.plist
      properties:
        CFBundleDisplayName: FlightGlance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.flightglance.FlightGlance.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
  FlightGlanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlightGlanceTests
    dependencies:
      - target: FlightGlance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.flightglance.FlightGlanceTests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FlightGlance:
    build:
      targets:
        FlightGlance: all
        FlightGlanceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlightGlanceTests
      gatherCoverageData: false
    archive:
      config: Release
